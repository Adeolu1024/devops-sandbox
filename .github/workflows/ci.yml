name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: |
          python -m py_compile \
            platform/api.py \
            platform/list_health.py \
            monitor/health_poller.py \
            platform/demo_app/app.py

      - name: Check shell syntax
        run: bash -n platform/*.sh

      - name: Build demo app image
        run: docker build -t sandbox-demo-app:ci platform/demo_app
